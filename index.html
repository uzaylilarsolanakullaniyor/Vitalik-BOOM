<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Vitalik</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Tahoma', 'Arial', sans-serif;
    touch-action: none;
  }
  canvas { display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// =============================================================
// FLAPPY VITALIK — Windows XP themed Flappy Bird
// =============================================================

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ---- Sizing ----
// We work in a virtual 320×568 space and scale to fit the screen.
const VW = 320, VH = 568;
let SCALE = 1;

function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  SCALE = Math.min(sw / VW, sh / VH);
  canvas.width  = Math.floor(VW * SCALE);
  canvas.height = Math.floor(VH * SCALE);
  canvas.style.width  = canvas.width  + 'px';
  canvas.style.height = canvas.height + 'px';
}
resize();
window.addEventListener('resize', resize);

// ---- SVG sprites ----
function svgToImg(svg, w, h) {
  return new Promise(res => {
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.src = url;
  });
}

const VITALIK_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <rect x="30" y="62" width="20" height="14" fill="#f5c9a0" rx="3"/>
  <ellipse cx="40" cy="42" rx="28" ry="32" fill="#f5c9a0"/>
  <ellipse cx="40" cy="16" rx="28" ry="14" fill="#2a1a0e"/>
  <rect x="12" y="10" width="56" height="20" fill="#2a1a0e" rx="8"/>
  <ellipse cx="13" cy="42" rx="5" ry="7" fill="#f0ba90"/>
  <ellipse cx="67" cy="42" rx="5" ry="7" fill="#f0ba90"/>
  <ellipse cx="29" cy="40" rx="7" ry="8" fill="white"/>
  <ellipse cx="51" cy="40" rx="7" ry="8" fill="white"/>
  <ellipse cx="30" cy="41" rx="4.5" ry="5" fill="#3a2010"/>
  <ellipse cx="52" cy="41" rx="4.5" ry="5" fill="#3a2010"/>
  <circle cx="31.5" cy="39.5" r="1.5" fill="white"/>
  <circle cx="53.5" cy="39.5" r="1.5" fill="white"/>
  <path d="M22 31 Q29 27 36 31" stroke="#2a1a0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 31 Q51 27 58 31" stroke="#2a1a0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="40" cy="49" rx="4" ry="3" fill="#e8a878"/>
  <path d="M32 57 Q40 62 48 57" stroke="#c07050" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>`;

const ETH_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 96">
  <defs>
    <linearGradient id="eg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a92b2"/>
      <stop offset="100%" style="stop-color:#454a75"/>
    </linearGradient>
    <linearGradient id="eg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#62688f"/>
      <stop offset="100%" style="stop-color:#2d3160"/>
    </linearGradient>
  </defs>
  <polygon points="30,2 58,50 30,62 2,50" fill="url(#eg1)"/>
  <polygon points="30,30 58,50 30,62 2,50" fill="url(#eg2)" opacity="0.85"/>
  <polygon points="30,68 58,50 30,94 2,50" fill="url(#eg1)"/>
  <polygon points="30,2 58,50 30,62 2,50" fill="white" opacity="0.06"/>
</svg>`;

let imgVitalik, imgEth;

// ---- Physics constants (virtual pixels @ 60fps) ----
const GRAVITY   = 0.45;   // added to vy each frame
const FLAP_VY   = -8.5;   // vy on tap (negative = up)
const VY_MAX    = 11.0;   // terminal velocity
const PIPE_SPD  = 2.4;    // px/frame pipe moves left

// ---- Game state ----
let state = 'intro'; // intro | playing | dead

// Bird (virtual px)
let bx, by, bvy, bAngle;
const BIRD_R = 22; // hitbox radius

// Playable floor = VH - taskbar (taskbar = 38px)
const TASKBAR_H = 38;
const FLOOR_Y   = VH - TASKBAR_H;

// Pipes
let pipes = [];
const PIPE_W   = 52;
const GAP_H    = 160;
const PIPE_INT = 220; // horizontal interval between pipe pairs

// Grace frames (no collision)
let graceFrames = 0;

// Score
let score = 0, hiScore = 0;

// ETH Price tracker
let ethPrice = 0;       // starts at $0, gains $1000 per pipe
let hiEthPrice = 0;     // all-time high price reached

// Flash
let flashA = 0;

// Clouds (fractional x,y for bg)
let clouds = [
  { x: 0.05, y: 0.10, w: 55, spd: 0.18 },
  { x: 0.38, y: 0.06, w: 45, spd: 0.14 },
  { x: 0.68, y: 0.13, w: 60, spd: 0.20 },
  { x: 0.88, y: 0.05, w: 40, spd: 0.16 },
];

// Particles
let particles = [];

// ---- Reset ----
function resetGame() {
  bx    = VW * 0.25;
  by    = VH * 0.45;
  bvy   = 0;
  bAngle = 0;
  pipes  = [];
  score  = 0;
  ethPrice = 0;         // reset price each run
  particles = [];
  flashA = 0;
  graceFrames = 75; // ~1.25s at 60fps — no collision, Vitalik blinks
  spawnPipe(VW + 80);
}

function spawnPipe(x) {
  // Gap center: keep well away from ceiling and floor
  const minY = 90,  maxY = FLOOR_Y - 90;
  const cy   = minY + Math.random() * (maxY - minY);
  pipes.push({ x, cy, passed: false });
}

// ---- Flap ----
function flap() {
  if (state === 'intro') {
    state = 'playing';
    resetGame();
    bvy = FLAP_VY;
    return;
  }
  if (state === 'dead') {
    state = 'playing';
    resetGame();
    bvy = FLAP_VY;
    return;
  }
  if (state === 'playing') {
    bvy = FLAP_VY;
  }
}

// ---- Particles ----
function burst(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI * 2 * i) / 10;
    particles.push({
      x, y,
      vx: Math.cos(a) * (1.5 + Math.random() * 2),
      vy: Math.sin(a) * (1.5 + Math.random() * 2),
      life: 1,
      col: `hsl(${200 + Math.random() * 60},80%,60%)`
    });
  }
}

// ---- Update ----
// dt: ms since last frame; we normalise to 60fps ticks
function update(dt) {
  const ticks = dt / 16.667; // how many 60fps frames elapsed

  // Clouds scroll regardless of state
  clouds.forEach(c => {
    c.x -= (c.spd * ticks) / VW;
    if (c.x * VW + c.w < 0) c.x = 1 + c.w / VW;
  });

  if (state !== 'playing') return;

  // ---- Bird physics ----
  bvy += GRAVITY * ticks;
  if (bvy > VY_MAX) bvy = VY_MAX;
  by  += bvy * ticks;

  // Rotation: tilt up when rising, down when falling
  const targetAngle = Math.max(-0.5, Math.min(1.2, bvy * 0.08));
  bAngle += (targetAngle - bAngle) * 0.18 * ticks;

  // ---- Pipes ----
  const spd = PIPE_SPD * ticks;
  pipes.forEach(p => { p.x -= spd; });
  pipes = pipes.filter(p => p.x + PIPE_W > -10);

  // Spawn next pipe
  const last = pipes[pipes.length - 1];
  if (!last || last.x < VW - PIPE_INT) spawnPipe(VW + 10);

  // Scoring
  pipes.forEach(p => {
    if (!p.passed && p.x + PIPE_W < bx - BIRD_R) {
      p.passed = true;
      score++;
      ethPrice += 1000;   // +$1,000 per pipe passed
    }
  });

  // ---- Grace period ----
  if (graceFrames > 0) {
    graceFrames -= ticks;
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; });
    particles = particles.filter(p => p.life > 0);
    return;
  }

  // ---- Collisions ----
  // Ceiling
  if (by - BIRD_R < 0) { die(); return; }
  // Floor
  if (by + BIRD_R > FLOOR_Y) { die(); return; }

  // Pipes
  for (const p of pipes) {
    const left  = p.x;
    const right = p.x + PIPE_W;
    if (bx + BIRD_R * 0.8 > left && bx - BIRD_R * 0.8 < right) {
      const gapTop = p.cy - GAP_H / 2;
      const gapBot = p.cy + GAP_H / 2;
      if (by - BIRD_R * 0.8 < gapTop || by + BIRD_R * 0.8 > gapBot) {
        die(); return;
      }
    }
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; });
  particles = particles.filter(p => p.life > 0);

  // Flash decay
  if (flashA > 0) flashA -= 0.04;
}

function die() {
  state  = 'dead';
  flashA = 0.7;
  if (score > hiScore) hiScore = score;
  if (ethPrice > hiEthPrice) hiEthPrice = ethPrice;
}

// ---- Draw helpers ----
function s(v) { return v * SCALE; } // virtual -> canvas px

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ---- Draw background ----
function drawBG() {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, s(FLOOR_Y));
  sky.addColorStop(0,    '#1a6bc7');
  sky.addColorStop(0.5,  '#4da6ff');
  sky.addColorStop(0.85, '#85c8f5');
  sky.addColorStop(1,    '#c0e890');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, s(VW), s(FLOOR_Y));

  // Hills
  ctx.fillStyle = '#3c8c1e';
  ctx.beginPath();
  ctx.moveTo(0, s(FLOOR_Y));
  ctx.bezierCurveTo(s(VW*0.15), s(FLOOR_Y*0.78), s(VW*0.4), s(FLOOR_Y*0.88), s(VW*0.5), s(FLOOR_Y*0.84));
  ctx.bezierCurveTo(s(VW*0.65), s(FLOOR_Y*0.80), s(VW*0.85), s(FLOOR_Y*0.90), s(VW), s(FLOOR_Y*0.85));
  ctx.lineTo(s(VW), s(FLOOR_Y));
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#4ea827';
  ctx.beginPath();
  ctx.moveTo(0, s(FLOOR_Y*0.92));
  ctx.bezierCurveTo(s(VW*0.2), s(FLOOR_Y*0.82), s(VW*0.45), s(FLOOR_Y*0.92), s(VW*0.6), s(FLOOR_Y*0.86));
  ctx.bezierCurveTo(s(VW*0.75), s(FLOOR_Y*0.80), s(VW*0.9), s(FLOOR_Y*0.90), s(VW), s(FLOOR_Y*0.87));
  ctx.lineTo(s(VW), s(FLOOR_Y));
  ctx.lineTo(0, s(FLOOR_Y));
  ctx.closePath();
  ctx.fill();
}

// ---- Draw taskbar ----
function drawTaskbar() {
  const ty = s(FLOOR_Y), th = s(TASKBAR_H);
  const tg = ctx.createLinearGradient(0, ty, 0, ty + th);
  tg.addColorStop(0,    '#3c74c0');
  tg.addColorStop(0.08, '#2a5aa8');
  tg.addColorStop(0.5,  '#1e4a92');
  tg.addColorStop(1,    '#0e2a60');
  ctx.fillStyle = tg;
  ctx.fillRect(0, ty, s(VW), th);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = s(1);
  ctx.beginPath(); ctx.moveTo(0, ty + s(1)); ctx.lineTo(s(VW), ty + s(1)); ctx.stroke();

  // Start button
  const bw = s(72), bh = s(26), bx2 = s(4), by2 = ty + s(6);
  const bg = ctx.createLinearGradient(bx2, by2, bx2, by2+bh);
  bg.addColorStop(0, '#55a832'); bg.addColorStop(1, '#2a6c10');
  ctx.fillStyle = bg;
  roundRect(bx2, by2, bw, bh, s(12)); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = s(1);
  roundRect(bx2, by2, bw, bh, s(12)); ctx.stroke();

  // Win flag
  const fx = bx2 + s(6), fy = by2 + s(5), fs = s(9);
  ctx.fillStyle='#e8403c'; ctx.fillRect(fx, fy, fs, fs);
  ctx.fillStyle='#40b840'; ctx.fillRect(fx+fs+s(1), fy, fs, fs);
  ctx.fillStyle='#4040e8'; ctx.fillRect(fx, fy+fs+s(1), fs, fs);
  ctx.fillStyle='#e8d030'; ctx.fillRect(fx+fs+s(1), fy+fs+s(1), fs, fs);

  ctx.fillStyle = 'white';
  ctx.font = `bold ${s(12)}px Tahoma`;
  ctx.textBaseline = 'middle';
  ctx.fillText('start', bx2 + s(30), by2 + bh/2);
  ctx.textBaseline = 'alphabetic';

  // Clock
  const now = new Date();
  const t = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  ctx.font = `${s(11)}px Tahoma`;
  ctx.fillStyle = 'white';
  ctx.textAlign = 'right';
  ctx.fillText(t, s(VW) - s(5), ty + s(24));
  ctx.textAlign = 'left';
}

// ---- Draw clouds ----
function drawClouds() {
  clouds.forEach(c => {
    const cx = c.x * s(VW), cy = c.y * s(VH), cw = s(c.w), ch = cw * 0.45;
    ctx.fillStyle = 'rgba(255,255,255,0.90)';
    ctx.beginPath(); ctx.ellipse(cx+cw*0.25, cy+ch*0.55, cw*0.28, ch*0.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+cw*0.5,  cy+ch*0.3,  cw*0.32, ch*0.65,0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+cw*0.75, cy+ch*0.55, cw*0.28, ch*0.5, 0, 0, Math.PI*2); ctx.fill();
  });
}

// ---- Draw pipes ----
function drawPipe(x, topH, botY) {
  // Colors
  const grad = (x2) => {
    const g = ctx.createLinearGradient(s(x), 0, s(x + PIPE_W), 0);
    g.addColorStop(0,   '#1a1d3a');
    g.addColorStop(0.3, '#2e3460');
    g.addColorStop(0.6, '#454a75');
    g.addColorStop(1,   '#1a1d3a');
    return g;
  };

  // Top pipe body
  if (topH > 0) {
    ctx.fillStyle = grad();
    ctx.fillRect(s(x), 0, s(PIPE_W), s(topH));
    ctx.strokeStyle = '#6670a0'; ctx.lineWidth = s(1.5);
    ctx.strokeRect(s(x), 0, s(PIPE_W), s(topH));

    // ETH logos tiled in top pipe
    if (imgEth) {
      const lw = s(PIPE_W * 0.8), lh = lw * 1.6;
      ctx.save();
      ctx.rect(s(x), 0, s(PIPE_W), s(topH)); ctx.clip();
      ctx.globalAlpha = 0.75;
      let yy = s(4);
      while (yy < s(topH)) { ctx.drawImage(imgEth, s(x) + (s(PIPE_W)-lw)/2, yy, lw, lh); yy += lh + s(4); }
      ctx.restore();
    }
    // Cap
    const capH = s(14);
    const cg = ctx.createLinearGradient(s(x-3), 0, s(x+PIPE_W+3), 0);
    cg.addColorStop(0, '#1a1d3a'); cg.addColorStop(0.5, '#7080c0'); cg.addColorStop(1, '#1a1d3a');
    ctx.fillStyle = cg;
    roundRect(s(x-3), s(topH) - capH, s(PIPE_W+6), capH, s(4)); ctx.fill();
    ctx.strokeStyle = '#8090c0'; ctx.lineWidth = s(1.5);
    roundRect(s(x-3), s(topH) - capH, s(PIPE_W+6), capH, s(4)); ctx.stroke();
  }

  // Bottom pipe body
  const botH = FLOOR_Y - botY;
  if (botH > 0) {
    ctx.fillStyle = grad();
    ctx.fillRect(s(x), s(botY), s(PIPE_W), s(botH));
    ctx.strokeStyle = '#6670a0'; ctx.lineWidth = s(1.5);
    ctx.strokeRect(s(x), s(botY), s(PIPE_W), s(botH));

    if (imgEth) {
      const lw = s(PIPE_W * 0.8), lh = lw * 1.6;
      ctx.save();
      ctx.rect(s(x), s(botY), s(PIPE_W), s(botH)); ctx.clip();
      ctx.globalAlpha = 0.75;
      let yy = s(botY) + s(4);
      while (yy < s(FLOOR_Y)) { ctx.drawImage(imgEth, s(x) + (s(PIPE_W)-lw)/2, yy, lw, lh); yy += lh + s(4); }
      ctx.restore();
    }
    // Cap
    const capH = s(14);
    const cg2 = ctx.createLinearGradient(s(x-3), 0, s(x+PIPE_W+3), 0);
    cg2.addColorStop(0, '#1a1d3a'); cg2.addColorStop(0.5, '#7080c0'); cg2.addColorStop(1, '#1a1d3a');
    ctx.fillStyle = cg2;
    roundRect(s(x-3), s(botY), s(PIPE_W+6), capH, s(4)); ctx.fill();
    ctx.strokeStyle = '#8090c0'; ctx.lineWidth = s(1.5);
    roundRect(s(x-3), s(botY), s(PIPE_W+6), capH, s(4)); ctx.stroke();
  }
}

function drawPipes() {
  pipes.forEach(p => {
    const topH = p.cy - GAP_H / 2;
    const botY = p.cy + GAP_H / 2;
    drawPipe(p.x, topH, botY);
  });
}

// ---- Draw Vitalik ----
function drawVitalik() {
  if (!imgVitalik) return;
  const size = BIRD_R * 3.8; // bigger for full-body pixel art
  ctx.save();
  ctx.translate(s(bx), s(by));
  ctx.rotate(bAngle);

  // Blink during grace
  if (graceFrames > 0 && Math.floor(graceFrames / 8) % 2 === 0) ctx.globalAlpha = 0.35;

  ctx.shadowColor = 'rgba(0,0,60,0.5)';
  ctx.shadowBlur  = s(8);
  ctx.shadowOffsetY = s(2);
  ctx.drawImage(imgVitalik, s(-size/2), s(-size/2), s(size), s(size));
  ctx.restore();
}

// ---- Draw particles ----
function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.col;
    ctx.shadowColor = p.col; ctx.shadowBlur = s(6);
    ctx.beginPath(); ctx.arc(s(p.x), s(p.y), s(4), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ---- Draw score + ETH price bar (during play) ----
function drawScore() {
  if (state !== 'playing') return;

  // ---- Score (small, top center) ----
  ctx.font = `bold ${s(22)}px Tahoma`;
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = s(3);
  ctx.strokeText(String(score), s(VW/2), s(36));
  ctx.fillStyle = 'white';
  ctx.fillText(String(score), s(VW/2), s(36));

  // ---- ETH price pill (top-right) ----
  const priceStr = '$' + ethPrice.toLocaleString();
  ctx.font = `bold ${s(13)}px Tahoma`;
  const pw = ctx.measureText(priceStr).width + s(16);
  const ph = s(22), px2 = s(VW) - pw - s(6), py2 = s(6);

  // Pill background (dark purple-blue, like ETH brand)
  ctx.fillStyle = 'rgba(40,30,80,0.88)';
  roundRect(px2, py2, pw, ph, s(10)); ctx.fill();
  ctx.strokeStyle = '#8090e0'; ctx.lineWidth = s(1.2);
  roundRect(px2, py2, pw, ph, s(10)); ctx.stroke();

  // Price text centered in pill
  ctx.fillStyle = '#d0d8ff';
  ctx.textAlign = 'center';
  ctx.fillText(priceStr, px2 + pw/2, py2 + ph * 0.72);
  ctx.textAlign = 'left';
}

// ---- Draw flash ----
function drawFlash() {
  if (flashA <= 0) return;
  ctx.fillStyle = `rgba(255,60,60,${flashA})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ---- XP Window helper ----
function drawXPWindow(x, y, w, h, title, redBar) {
  // Shadow
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = s(16); ctx.shadowOffsetX = s(4); ctx.shadowOffsetY = s(4);
  ctx.fillStyle = '#ece9d8';
  roundRect(s(x), s(y), s(w), s(h), s(8)); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

  // Title bar
  const tbH = s(26);
  const tbg = ctx.createLinearGradient(s(x), s(y), s(x), s(y) + tbH);
  if (redBar) {
    tbg.addColorStop(0, '#d83030'); tbg.addColorStop(1, '#780808');
  } else {
    tbg.addColorStop(0, '#2a7fd8'); tbg.addColorStop(1, '#0a3890');
  }
  ctx.fillStyle = tbg;
  ctx.save(); roundRect(s(x), s(y), s(w), tbH, s(8)); ctx.clip();
  ctx.fillRect(s(x), s(y), s(w), tbH);
  ctx.restore();

  ctx.fillStyle = 'white';
  ctx.font = `bold ${s(12)}px Tahoma`;
  ctx.textBaseline = 'middle';
  ctx.fillText(title, s(x + 10), s(y) + tbH / 2);
  ctx.textBaseline = 'alphabetic';

  // Window controls
  const btns = ['#e81010','#f0c000','#28b828'];
  btns.forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(s(x + w - 12 - i*18), s(y) + tbH/2, s(6), 0, Math.PI*2); ctx.fill();
  });

  return tbH / SCALE; // return title bar height in virtual px
}

// ---- Draw intro ----
function drawIntro() {
  const wx = 24, wy = 80, ww = VW - 48, wh = 340;
  const tbH = drawXPWindow(wx, wy, ww, wh, '⬡  Flappy Vitalik', false);
  const cx = wx + ww / 2;

  // Vitalik preview
  if (imgVitalik) {
    const sz = s(60);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,80,0.3)'; ctx.shadowBlur = s(8);
    ctx.drawImage(imgVitalik, s(cx) - sz/2, s(wy + tbH + 14), sz, sz);
    ctx.restore();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#1e3a80';
  ctx.font = `bold ${s(17)}px Tahoma`;
  ctx.fillText('FLAPPY VITALIK', s(cx), s(wy + tbH + 90));

  ctx.fillStyle = '#444';
  ctx.font = `${s(10)}px Tahoma`;
  ctx.fillText('Navigate through the Ethereum blockchain!', s(cx), s(wy + tbH + 108));
  ctx.fillText('Space / Click / Tap to flap', s(cx), s(wy + tbH + 124));

  if (hiScore > 0) {
    ctx.fillStyle = '#8a2000';
    ctx.font = `bold ${s(11)}px Tahoma`;
    ctx.fillText('High Score: ' + hiScore, s(cx), s(wy + tbH + 144));
  }

  // Start button
  const btnW = s(120), btnH = s(28);
  const btnX = s(cx) - btnW/2, btnY = s(wy + tbH + 158);
  const bg = ctx.createLinearGradient(btnX, btnY, btnX, btnY+btnH);
  bg.addColorStop(0, '#e8e8e8'); bg.addColorStop(1, '#b0b0b0');
  ctx.fillStyle = bg;
  roundRect(btnX, btnY, btnW, btnH, s(4)); ctx.fill();
  ctx.strokeStyle = '#888'; ctx.lineWidth = s(1.5);
  roundRect(btnX, btnY, btnW, btnH, s(4)); ctx.stroke();
  ctx.strokeStyle = '#1058c8'; ctx.lineWidth = s(2);
  roundRect(btnX-s(1), btnY-s(1), btnW+s(2), btnH+s(2), s(5)); ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.font = `bold ${s(11)}px Tahoma`;
  ctx.fillText('▶  Click to Start', s(cx), btnY + btnH * 0.68);

  ctx.textAlign = 'left';
}

// ---- Draw game over ----
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const wx = 24, wy = 90, ww = VW - 48, wh = 330;
  const tbH = drawXPWindow(wx, wy, ww, wh, '⬡  Blockchain Collision!', true);
  const cx  = wx + ww / 2;

  // Error icon
  const ix = s(wx + 26), iy = s(wy + tbH + 22);
  ctx.fillStyle = '#cc0000';
  ctx.beginPath(); ctx.arc(ix, iy, s(13), 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'white'; ctx.lineWidth = s(2.5); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ix-s(6), iy-s(6)); ctx.lineTo(ix+s(6), iy+s(6)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ix+s(6), iy-s(6)); ctx.lineTo(ix-s(6), iy+s(6)); ctx.stroke();

  ctx.fillStyle = '#111';
  ctx.font = `bold ${s(11)}px Tahoma`;
  ctx.fillText('Vitalik hit the ETH chain.', s(wx + 46), s(wy + tbH + 18));
  ctx.font = `${s(10)}px Tahoma`;
  ctx.fillStyle = '#555';
  ctx.fillText('Fatal block collision detected.', s(wx + 46), s(wy + tbH + 34));

  ctx.strokeStyle = '#b0aaa0'; ctx.lineWidth = s(1);
  ctx.beginPath(); ctx.moveTo(s(wx+10), s(wy+tbH+50)); ctx.lineTo(s(wx+ww-10), s(wy+tbH+50)); ctx.stroke();

  ctx.textAlign = 'center';

  // Score
  ctx.fillStyle = '#1e1e80';
  ctx.font = `bold ${s(20)}px Tahoma`;
  ctx.fillText('Score: ' + score, s(cx), s(wy + tbH + 62));

  ctx.fillStyle = '#8a2000';
  ctx.font = `bold ${s(12)}px Tahoma`;
  ctx.fillText('High Score: ' + hiScore, s(cx), s(wy + tbH + 80));

  // Divider 1
  ctx.strokeStyle = '#c0bbb0'; ctx.lineWidth = s(0.8);
  ctx.beginPath(); ctx.moveTo(s(wx+14), s(wy+tbH+88)); ctx.lineTo(s(wx+ww-14), s(wy+tbH+88)); ctx.stroke();

  // ETH Price Reached label
  ctx.fillStyle = '#454a75';
  ctx.font = `bold ${s(13)}px Tahoma`;
  ctx.fillText('ETH Price Reached', s(cx), s(wy + tbH + 108));

  // Big ETH price number
  ctx.fillStyle = '#1a1a90';
  ctx.font = `bold ${s(26)}px Tahoma`;
  ctx.fillText('$' + ethPrice.toLocaleString(), s(cx), s(wy + tbH + 140));

  // Divider 2
  ctx.strokeStyle = '#c0bbb0'; ctx.lineWidth = s(0.8);
  ctx.beginPath(); ctx.moveTo(s(wx+14), s(wy+tbH+150)); ctx.lineTo(s(wx+ww-14), s(wy+tbH+150)); ctx.stroke();

  // All-time high
  ctx.fillStyle = '#8a5000';
  ctx.font = `bold ${s(12)}px Tahoma`;
  ctx.fillText('All-Time High: $' + hiEthPrice.toLocaleString(), s(cx), s(wy + tbH + 168));

  // Restart button
  const bw = s(130), bh = s(28), bx2 = s(cx)-bw/2, by2 = s(wy+tbH+188);
  const bg = ctx.createLinearGradient(bx2, by2, bx2, by2+bh);
  bg.addColorStop(0, '#e8e8e8'); bg.addColorStop(1, '#b0b0b0');
  ctx.fillStyle = bg;
  roundRect(bx2, by2, bw, bh, s(4)); ctx.fill();
  ctx.strokeStyle = '#1058c8'; ctx.lineWidth = s(2);
  roundRect(bx2-s(1), by2-s(1), bw+s(2), bh+s(2), s(5)); ctx.stroke();
  ctx.strokeStyle = '#888'; ctx.lineWidth = s(1);
  roundRect(bx2, by2, bw, bh, s(4)); ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.font = `bold ${s(11)}px Tahoma`;
  ctx.fillText('↺  Try Again', s(cx), by2 + bh * 0.68);

  ctx.textAlign = 'left';
}

// ---- Main loop ----
let lastTs = null;
function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(ts - lastTs, 50);
  lastTs = ts;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBG();
  drawClouds();
  drawPipes();
  drawVitalik();
  drawParticles();
  drawTaskbar();
  drawScore();
  drawFlash();

  if (state === 'intro') drawIntro();
  if (state === 'dead')  drawGameOver();

  update(dt);
  requestAnimationFrame(loop);
}

// ---- Input ----
function onInput(e) { e.preventDefault(); flap(); }
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
canvas.addEventListener('pointerdown', onInput);

// ---- Boot ----
async function boot() {
  // Load pixel-art Vitalik and remove black background
  imgVitalik = await new Promise(res => {
    const img = new Image();
    img.onload = () => {
      // Draw to offscreen canvas and remove near-black pixels
      const oc = document.createElement('canvas');
      oc.width = img.width; oc.height = img.height;
      const octx = oc.getContext('2d');
      octx.drawImage(img, 0, 0);
      const id = octx.getImageData(0, 0, oc.width, oc.height);
      const d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        // If pixel is near-black, make it transparent
        // Remove black/near-black and also smooth semi-transparent edges
        if (r < 40 && g < 40 && b < 40) {
          d[i+3] = 0;
        } else if (r < 80 && g < 80 && b < 80) {
          // Semi-transparent for dark edge anti-aliasing
          d[i+3] = Math.round(d[i+3] * ((r + g + b) / 240));
        }
      }
      octx.putImageData(id, 0, 0);
      const out = new Image();
      out.onload = () => res(out);
      out.src = oc.toDataURL();
